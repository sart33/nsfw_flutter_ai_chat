name: nsfw_chat
description: "Uncensored Souls"
publish_to: 'none'
version: 1.0.0+1

flutter_native_splash:
  color: "#000000"
  image: assets/logos/logo_1.png
  android_12:
    color: "#000000"
    image: assets/logos/logo_1.png
    icon_background_color: "#000000"
  web: false

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  http: ^1.2.2
  photo_view: ^0.14.0
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  fluttertoast: ^8.2.10
  path_provider: ^2.1.5
  uuid: ^4.5.1
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  path: any
  collection: ^1.19.0
  flutter_native_splash: ^2.4.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/json/image_templates.json
    - assets/characters/
    - assets/images/
    - assets/avatars/
    - assets/logos/
